emailVerificationSubject=Verify your email to activate your EduLage account
emailVerificationBody=Welcome to EduLage!\n\nPlease confirm your email address by opening this link:\n{0}\n\nThe link expires in {3}.\n\nIf you did not create an EduLage account, you can ignore this message.
emailVerificationBodyHtml=<h1 style="margin:0 0 16px;font-family:'Plus Jakarta Sans','Inter',Helvetica,Arial,sans-serif;font-size:24px;line-height:32px;font-weight:800;letter-spacing:-0.02em;color:#09184f;">Welcome to EduLage</h1><p style="margin:0 0 20px;">Please confirm your email address to activate your account and open My Learning.</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;"><tr><td bgcolor="#0e8e73" style="background-color:#0e8e73;border-radius:12px;"><a href="{0}" target="_blank" style="display:inline-block;padding:14px 26px;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;line-height:20px;color:#ffffff;text-decoration:none;">Verify my email</a></td></tr></table><p style="margin:0 0 12px;font-size:14px;line-height:22px;">This link expires in {3}. If the button does not work, copy this address into your browser:<br/><a href="{0}" style="color:#0e8e73;word-break:break-all;">{0}</a></p><p style="margin:0;font-size:14px;line-height:22px;color:#94a3b8;">If you did not create an EduLage account, you can safely ignore this message.</p>
passwordResetSubject=Reset your EduLage password
passwordResetBody=Someone requested a password reset for your EduLage account. If this was you, open this link to choose a new password:\n{0}\n\nThe link expires in {3}.\n\nIf you did not request this, ignore this message and your password will not change.
passwordResetBodyHtml=<h1 style="margin:0 0 16px;font-family:'Plus Jakarta Sans','Inter',Helvetica,Arial,sans-serif;font-size:24px;line-height:32px;font-weight:800;letter-spacing:-0.02em;color:#09184f;">Reset your password</h1><p style="margin:0 0 20px;">Someone requested a password reset for your EduLage account. If this was you, choose a new password below.</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;"><tr><td bgcolor="#0e8e73" style="background-color:#0e8e73;border-radius:12px;"><a href="{0}" target="_blank" style="display:inline-block;padding:14px 26px;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;line-height:20px;color:#ffffff;text-decoration:none;">Choose a new password</a></td></tr></table><p style="margin:0 0 12px;font-size:14px;line-height:22px;">This link expires in {3}. If the button does not work, copy this address into your browser:<br/><a href="{0}" style="color:#0e8e73;word-break:break-all;">{0}</a></p><p style="margin:0;font-size:14px;line-height:22px;color:#94a3b8;">If you did not request this, ignore this message and your password will not change.</p>
executeActionsSubject=Action required on your EduLage account

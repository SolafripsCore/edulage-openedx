{% load i18n %}

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<meta name="supported-color-schemes" content="light"/>
{% get_current_language as LANGUAGE_CODE %}
<title lang="{{ LANGUAGE_CODE|default:"en" }}">
  {% block title %}{{ platform_name }}{% endblock %}
</title>

<style type="text/css">
    /* Tokens mirror EduLage/src/app/globals.css; everything visible is also inlined for clients that drop <style>. */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
    * {margin-top:0;margin-bottom:0;padding:0;border:none;outline:none;list-style:none;-webkit-text-size-adjust:none;}
    body {margin:0 !important;padding:0 !important;width:100% !important;-webkit-text-size-adjust:100% !important;-ms-text-size-adjust:100% !important;-webkit-font-smoothing:antialiased !important;background-color:#f7f9fc;}
    img {border:0 !important;display:block !important;outline:none !important;}
    table {border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;}
    td {border-collapse:collapse;mso-line-height-rule:exactly;}
    a {color:#0e8e73;}
    h1 {font-family:'Plus Jakarta Sans','Inter',Helvetica,Arial,sans-serif;font-weight:800;font-size:26px;line-height:32px;letter-spacing:-0.02em;color:#09184f;margin:0 0 16px;}
    h2 {font-family:'Plus Jakarta Sans','Inter',Helvetica,Arial,sans-serif;font-weight:700;font-size:18px;line-height:24px;color:#09184f;margin:24px 0 8px;}
    p {font-family:'Inter',Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#475569;margin:0 0 16px;}
    @media only screen and (min-device-width: 601px) {
      .content {width:600px !important;}
    }
    @-ms-viewport {width:device-width;}
    @media only screen and (max-width:480px) {
      .width_100percent {width:100% !important;}
      .min_width {min-width:320px !important;}
      .mobile_img {width:100% !important;height:auto !important;}
      .el-logo {width:104px !important;}
      .display_block {display:block !important;}
      .height_0 {height:0 !important;}
      .padding_none {padding-left:0 !important;padding-right:0 !important;}
      .paddingtop_10 {padding-top:10px !important;}
      .el-main {padding:28px 22px 32px 22px !important;}
      .el-col {display:block !important;width:100% !important;padding:0 0 12px 0 !important;}
      td[class="col"] {display:block;width:100%;box-sizing:border-box;float:left;text-align:left !important;padding-bottom:20px;}
    }
</style>
{% block additional_styles %}{% endblock %}
